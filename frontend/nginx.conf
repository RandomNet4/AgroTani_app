server {
    listen 80;
    server_name agrotaniapp.my.id www.agrotaniapp.my.id localhost;

    # Folder tempat file HTML/JS/CSS hasil build React diletakkan
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Penting untuk routing SPA (Single Page Application) React Router
        try_files $uri $uri/ /index.html;
        # Jangan cache index.html agar user selalu dapat versi terbaru
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache gambar & aset statis lebih lama (hash sudah diurus Vite)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # JS & CSS: Vite sudah pakai content-hash di nama file
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SSE Endpoint: Konfigurasi khusus agar tidak dibuffer Nginx ──
    location /api/events {
        proxy_pass http://backend-app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';

        # Matikan buffering agar event SSE langsung diteruskan ke browser
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 24 jam — koneksi SSE bisa long-lived
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Proxy request API ke service backend-app di dalam Docker Network
    location /api/ {
        proxy_pass http://backend-app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}


